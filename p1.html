<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedNest - لوحة الإدارة</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body {
    font-family: 'Cairo', sans-serif;
    background: #061a0c;
    color: #d0f5e0;
  }
  .glass {
    background: rgba(10, 40, 18, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 230, 118, 0.2);
    border-radius: 16px;
  }
  .btn-ac { background: #00e676; color: #000; transition: all 0.2s; }
  .btn-ac:hover { background: #00cc66; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,230,118,0.3); }
  .btn-no { background: #ff5252; color: #fff; transition: all 0.2s; }
  .btn-no:hover { background: #ff3333; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,82,82,0.3); }
  
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  th { background: rgba(0, 230, 118, 0.1); color: #00e676; padding: 12px; text-align: right; font-weight: 900; }
  td { padding: 12px; border-bottom: 1px solid rgba(0, 230, 118, 0.1); }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: rgba(255,255,255,0.02); }

  /* Tab system */
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
  .tab-btn.active { background: #00e676; color: #000; font-weight: bold; }
  .tab-btn { background: rgba(0, 230, 118, 0.1); color: #00e676; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  
  /* Loading Overlay */
  #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; justify-content: center; align-items: center; flex-direction: column; }
  
  /* Modal Overlay */
  #user-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
  .modal-content { background: #061a0c; border: 1px solid #00e676; border-radius: 16px; padding: 24px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,230,118,0.2); }
</style>
</head>
<body class="p-4 md:p-8 min-h-screen">

<div id="loader">
  <i class="fas fa-circle-notch fa-spin text-4xl text-[#00e676] mb-4"></i>
  <p class="text-lg font-bold">جاري معالجة البيانات...</p>
</div>

<!-- Modal لعرض التفاصيل -->
<div id="user-modal">
  <div class="modal-content relative">
    <button onclick="closeModal()" class="absolute top-4 left-4 text-[#ff5252] hover:text-red-400 text-2xl transition-all"><i class="fas fa-times-circle"></i></button>
    <h2 class="text-2xl font-black text-[#00e676] mb-6 border-b border-[#00e67655] pb-3"><i class="fas fa-id-card ml-2"></i>ملف المستخدم</h2>
    <div id="modal-body" class="space-y-4">
      <!-- سيتم حقن البيانات هنا -->
    </div>
  </div>
</div>

<div class="max-w-6xl mx-auto">
  <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
    <h1 class="text-3xl font-black text-[#00e676]"><i class="fas fa-shield-alt ml-2"></i>لوحة تحكم SpeedNest</h1>
    <div class="flex gap-2">
      <button onclick="switchTab('users-tab')" id="btn-users-tab" class="tab-btn active px-6 py-2 rounded-xl transition-all"><i class="fas fa-users ml-2"></i>المستخدمين</button>
      <button onclick="switchTab('comments-tab')" id="btn-comments-tab" class="tab-btn px-6 py-2 rounded-xl transition-all"><i class="fas fa-comments ml-2"></i>التعليقات المعلقة</button>
    </div>
  </div>

  <div id="users-tab" class="tab-content active">
    <div class="glass p-6 mb-6 flex flex-wrap gap-4 items-center">
      <div class="flex-1 min-w-[250px]">
        <div class="relative">
          <i class="fas fa-search absolute right-4 top-3.5 text-gray-400"></i>
          <input type="text" id="search" placeholder="ابحث بالاسم، الإيميل، أو الـ ID..." class="w-full bg-[#10361a] border border-[#00e67655] text-white rounded-xl py-3 pr-12 pl-4 outline-none focus:border-[#00e676] transition-all">
        </div>
      </div>
      <button onclick="searchUsers()" class="btn-ac px-6 py-3 rounded-xl font-bold"><i class="fas fa-filter ml-2"></i>بحث</button>
      <button onclick="loadUsers()" class="px-6 py-3 rounded-xl font-bold bg-[#10361a] border border-[#00e67655] hover:bg-[#1a4a25] transition-all"><i class="fas fa-sync-alt ml-2"></i>تحديث</button>
    </div>

    <div class="glass overflow-x-auto rounded-2xl">
      <table class="w-full text-sm md:text-base">
        <thead>
          <tr>
            <th>الاسم</th>
            <th>الإيميل / الـ ID</th>
            <th>الكوينز / السكور</th>
            <th>الحالة</th>
            <th class="text-center">إجراءات</th>
          </tr>
        </thead>
        <tbody id="users-body">
          <tr><td colspan="5" class="text-center py-8 text-gray-400">جاري تحميل المستخدمين...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="comments-tab" class="tab-content">
    <div class="glass p-6 mb-6 flex justify-between items-center">
      <h2 class="text-xl font-bold text-[#00e676]"><i class="fas fa-clock ml-2"></i>تعليقات تنتظر الموافقة</h2>
      <button onclick="loadComments()" class="px-4 py-2 rounded-xl font-bold bg-[#10361a] border border-[#00e67655] hover:bg-[#1a4a25] transition-all"><i class="fas fa-sync-alt ml-2"></i>تحديث</button>
    </div>

    <div id="comments-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-8 text-gray-400">جاري تحميل التعليقات...</div>
    </div>
  </div>

</div>

<script type="module">
  // Firebase Setup
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBi-a06cP8HeI1QSSDSrtXxyVZEx7XgR0U",
    authDomain: "speednest-c3b61.firebaseapp.com",
    projectId: "speednest-c3b61",
    storageBucket: "speednest-c3b61.firebasestorage.app",
    messagingSenderId: "930360784623",
    appId: "1:930360784623:web:c7cfcf80b407ecc35d4d1a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let allUsers = [];

  // --- UI Functions ---
  window.switchTab = function(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.getElementById(`btn-${tabId}`).classList.add('active');
    
    if(tabId === 'users-tab') loadUsers();
    if(tabId === 'comments-tab') loadComments();
  };

  const showLoader = () => document.getElementById('loader').style.display = 'flex';
  const hideLoader = () => document.getElementById('loader').style.display = 'none';

  // --- Users Management ---
  window.loadUsers = async function() {
    showLoader();
    try {
      const snap = await getDocs(collection(db, 'users'));
      allUsers = [];
      snap.forEach(docSnap => {
        allUsers.push({ docId: docSnap.id, ...docSnap.data() });
      });
      renderUsers(allUsers);
    } catch (e) {
      console.error(e);
      alert("حدث خطأ أثناء جلب المستخدمين.");
    }
    hideLoader();
  };

  window.renderUsers = function(usersToRender) {
    const tbody = document.getElementById('users-body');
    tbody.innerHTML = '';

    if(usersToRender.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-400">لا يوجد مستخدمين لعرضهم.</td></tr>`;
      return;
    }

    usersToRender.forEach(user => {
      const isBanned = user.banned === true;
      const emailOrId = user.email ? user.email : `<span class="text-xs text-gray-500">${user.uid || user.docId}</span>`;
      
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="font-bold flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-[#10361a] flex items-center justify-center border border-[#00e67655]">
            ${user.avatar ? `<img src="${user.avatar}" class="w-full h-full rounded-full object-cover">` : '<i class="fas fa-user text-xs"></i>'}
          </div>
          ${user.name || 'Player'}
        </td>
        <td class="font-mono text-sm">${emailOrId}</td>
        <td><span class="text-[#00e676] font-bold">${user.coins || 0}🪙</span> | ⭐ ${user.score || 0}</td>
        <td>
          <span class="px-3 py-1 rounded-full text-xs font-bold ${isBanned ? 'bg-red-900 text-red-300' : 'bg-green-900 text-green-300'}">
            ${isBanned ? 'محظور' : 'نشط'}
          </span>
        </td>
        <td class="text-center">
          <div class="flex gap-2 justify-center flex-wrap">
            <button onclick="showUserDetails('${user.docId}')" class="px-3 py-1 rounded-lg text-xs font-bold bg-blue-900 text-blue-100 hover:bg-blue-600 transition-all" title="عرض التفاصيل">
              <i class="fas fa-info-circle"></i> تفاصيل
            </button>
            <button onclick="changePassword('${user.docId}')" class="px-3 py-1 rounded-lg text-xs font-bold bg-yellow-900 text-yellow-100 hover:bg-yellow-600 transition-all" title="تغيير كلمة المرور">
              <i class="fas fa-key"></i> باسوورد
            </button>
            <button onclick="editCoins('${user.docId}', ${user.coins || 0})" class="px-3 py-1 rounded-lg text-xs font-bold bg-[#10361a] border border-[#00e67655] hover:bg-[#00e676] hover:text-black transition-all">
              <i class="fas fa-coins ml-1"></i>كوينز
            </button>
            <button onclick="toggleBan('${user.docId}', ${isBanned})" class="px-3 py-1 rounded-lg text-xs font-bold ${isBanned ? 'bg-gray-600 hover:bg-gray-500' : 'btn-no'}">
              ${isBanned ? '<i class="fas fa-unlock"></i>' : '<i class="fas fa-ban"></i>'}
            </button>
            <button onclick="deleteUser('${user.docId}')" class="px-3 py-1 rounded-lg text-xs font-bold bg-red-900 text-red-100 hover:bg-red-600 transition-all">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  };

  // --- Modal & Detailed Info ---
  window.showUserDetails = function(docId) {
    const user = allUsers.find(u => u.docId === docId);
    if(!user) return;
    
    const modalBody = document.getElementById('modal-body');
    modalBody.innerHTML = `
      <div class="flex justify-center mb-6">
        <div class="relative">
          ${user.avatar ? `<img src="${user.avatar}" class="w-28 h-28 rounded-full border-4 border-[#00e676] object-cover shadow-[0_0_15px_rgba(0,230,118,0.5)]">` : `<div class="w-28 h-28 rounded-full bg-[#10361a] border-4 border-[#00e676] flex justify-center items-center shadow-[0_0_15px_rgba(0,230,118,0.5)]"><i class="fas fa-user text-5xl text-[#00e676]"></i></div>`}
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4 bg-[#10361a] p-4 rounded-xl border border-[#00e67633]">
        <div><p class="text-xs text-gray-400 mb-1"><i class="fas fa-user ml-1"></i>الاسم</p><p class="font-bold text-lg">${user.name || 'غير محدد'}</p></div>
        <div><p class="text-xs text-gray-400 mb-1"><i class="fas fa-envelope ml-1"></i>الإيميل</p><p class="font-bold text-sm truncate" title="${user.email}">${user.email || 'غير محدد'}</p></div>
        <div><p class="text-xs text-gray-400 mb-1"><i class="fas fa-calendar-alt ml-1"></i>السن</p><p class="font-bold">${user.age || 'غير محدد'}</p></div>
        <div><p class="text-xs text-gray-400 mb-1"><i class="fas fa-phone ml-1"></i>رقم الهاتف</p><p class="font-bold">${user.phone || 'غير محدد'}</p></div>
        <div><p class="text-xs text-gray-400 mb-1"><i class="fas fa-venus-mars ml-1"></i>الجنس</p><p class="font-bold">${user.gender || 'غير محدد'}</p></div>
        <div><p class="text-xs text-gray-400 mb-1"><i class="fas fa-city ml-1"></i>المدينة</p><p class="font-bold">${user.city || 'غير محدد'}</p></div>
        <div class="col-span-2 pt-2 border-t border-[#00e67633]">
          <p class="text-xs text-gray-400 mb-1"><i class="fas fa-lock ml-1"></i>كلمة المرور الحالية (المخزنة)</p>
          <p class="font-bold text-yellow-400 tracking-wider">${user.password || '<span class="text-gray-500 text-sm">مخفية أو يستخدم مصادقة Auth</span>'}</p>
        </div>
      </div>
    `;
    document.getElementById('user-modal').style.display = 'flex';
  };

  window.closeModal = function() {
    document.getElementById('user-modal').style.display = 'none';
  };

  window.changePassword = async function(docId) {
    const user = allUsers.find(u => u.docId === docId);
    const newPassword = prompt(`تغيير كلمة المرور لحساب (${user.name || user.email}):\nأدخل كلمة المرور الجديدة:`);
    
    if(newPassword === null || newPassword.trim() === "") return;

    showLoader();
    try {
      await updateDoc(doc(db, 'users', docId), { password: newPassword });
      alert("تم تحديث كلمة المرور في قاعدة البيانات بنجاح!");
      await loadUsers(); // Refresh data
    } catch(e) {
      console.error(e);
      alert("حدث خطأ أثناء تغيير كلمة المرور.");
    }
    hideLoader();
  };

  // ------------------------------------
  
  window.searchUsers = function() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    if(!q) { renderUsers(allUsers); return; }
    
    const filtered = allUsers.filter(u => 
      (u.name || '').toLowerCase().includes(q) || 
      (u.email || '').toLowerCase().includes(q) || 
      (u.uid || '').toLowerCase().includes(q) ||
      (u.phone || '').toLowerCase().includes(q)
    );
    renderUsers(filtered);
  };

  window.toggleBan = async function(docId, currentStatus) {
    const confirmMsg = currentStatus ? "هل أنت متأكد من فك الحظر عن هذا المستخدم؟" : "هل أنت متأكد من حظر هذا المستخدم؟";
    if(!confirm(confirmMsg)) return;

    showLoader();
    try {
      await updateDoc(doc(db, 'users', docId), { banned: !currentStatus });
      await loadUsers(); // Refresh
    } catch(e) {
      console.error(e);
      alert("حدث خطأ أثناء التحديث");
    }
    hideLoader();
  };

  window.editCoins = async function(docId, currentCoins) {
    const amountStr = prompt(`المستخدم يمتلك ${currentCoins} كوينز حالياً.\nأدخل العدد الجديد (أو أضف +50 أو -20):`, currentCoins);
    if(amountStr === null || amountStr === "") return;

    let newAmount = currentCoins;
    if(amountStr.startsWith('+')) {
      newAmount += parseInt(amountStr.replace('+',''), 10);
    } else if (amountStr.startsWith('-')) {
      newAmount -= parseInt(amountStr.replace('-',''), 10);
    } else {
      newAmount = parseInt(amountStr, 10);
    }

    if(isNaN(newAmount) || newAmount < 0) { alert("رقم غير صالح!"); return; }

    showLoader();
    try {
      await updateDoc(doc(db, 'users', docId), { coins: newAmount });
      await loadUsers();
    } catch(e) {
      console.error(e);
      alert("حدث خطأ أثناء تعديل الكوينز");
    }
    hideLoader();
  };

  window.deleteUser = async function(docId) {
    if(!confirm("تحذير: هل أنت متأكد من حذف هذا الحساب نهائياً؟ لا يمكن التراجع عن هذا الإجراء!")) return;
    
    showLoader();
    try {
      await deleteDoc(doc(db, 'users', docId));
      await loadUsers();
    } catch(e) {
      console.error(e);
      alert("حدث خطأ أثناء الحذف");
    }
    hideLoader();
  };

  // --- Comments Management ---
  window.loadComments = async function() {
    showLoader();
    const grid = document.getElementById('comments-grid');
    grid.innerHTML = '';
    
    try {
      const q = query(collection(db, 'comments'), where('status', '==', 'pending'));
      const snap = await getDocs(q);
      
      if(snap.empty) {
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-gray-400">لا توجد تعليقات جديدة معلقة.</div>`;
        hideLoader();
        return;
      }

      snap.forEach(docSnap => {
        const data = docSnap.data();
        const dateStr = data.createdAt ? new Date(data.createdAt.toMillis()).toLocaleString('ar-EG') : 'غير معروف';
        
        const card = document.createElement('div');
        card.className = "glass p-5 flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-3">
              <div>
                <h3 class="font-bold text-[#00e676]">${data.authorName || 'Player'}</h3>
                <p class="text-xs text-gray-400">${data.authorEmail || 'لا يوجد إيميل'}</p>
              </div>
              <span class="text-xs text-gray-500">${dateStr}</span>
            </div>
            <p class="text-sm leading-relaxed mb-4 bg-[#0a1628] p-3 rounded-xl border border-gray-800">${data.text}</p>
          </div>
          <div class="flex gap-2 border-t border-[#00e67633] pt-4 mt-auto">
            <button onclick="approveComment('${docSnap.id}')" class="flex-1 btn-ac py-2 rounded-xl text-sm font-bold"><i class="fas fa-check ml-1"></i>موافقة</button>
            <button onclick="rejectComment('${docSnap.id}')" class="flex-1 btn-no py-2 rounded-xl text-sm font-bold"><i class="fas fa-trash ml-1"></i>رفض وحذف</button>
          </div>
        `;
        grid.appendChild(card);
      });
    } catch (e) {
      console.error(e);
      grid.innerHTML = `<div class="col-span-full text-center py-8 text-red-400">حدث خطأ أثناء جلب التعليقات.</div>`;
    }
    hideLoader();
  };

  window.approveComment = async function(docId) {
    showLoader();
    try {
      await updateDoc(doc(db, 'comments', docId), { status: 'approved' });
      await loadComments();
    } catch(e) {
      console.error(e);
      alert("حدث خطأ أثناء قبول التعليق");
    }
    hideLoader();
  };

  window.rejectComment = async function(docId) {
    if(!confirm("هل أنت متأكد من رفض وحذف هذا التعليق؟")) return;
    showLoader();
    try {
      await deleteDoc(doc(db, 'comments', docId));
      await loadComments();
    } catch(e) {
      console.error(e);
      alert("حدث خطأ أثناء حذف التعليق");
    }
    hideLoader();
  };

  // Initial Load
  loadUsers();

</script>
</body>
</html>
